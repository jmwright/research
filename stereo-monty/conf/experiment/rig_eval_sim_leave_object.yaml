# @package _global_
#
# Stage 1's gate: get a policy that leaves the object, in simulation.
#
# The recognition result is not the point here. `informed_random_walk_20` allows
# exactly one step off the object and immediately replays its reverse, so on a
# glass the sensor is penned inside a silhouette that has no handle and never
# visits the one place the mug and the glass disagree - all 307 excursions across
# the three earlier runs were one step long. This config swaps that walk for a
# fixed spiral and asks whether the excursions get out and stay out.
#
# `NaiveScanPolicy` takes `percept` and ignores it: no on-object test, no undo,
# just LookUp / TurnLeft / LookDown / TurnRight outward until the arm reaches 90
# degrees. A `fixed_amount: 5` the spiral is k*(k-1)+1 = 307 steps for
# k = ceil(90/5), and the matching `NaiveScan` recognition policy ends the episode
# there, so `max_eval_steps` never binds.  Ignoring `percept` also makes the walk
# identical for every object, which is what lets the mug and the glass be compared
# step by step.
#
# The distant agent is the only one that can be off-object at all, and it matches
# the rig's geometry. Everything else - learning module, connectivity, graph config
# - is `rig_eval_sim.yaml` unchanged, so the library and the matching stay the only
# constants. The transform is the non-clip variant; `_clip` blanks depth past 5 cm
# for a surface agent's finger and would erase an object at 0.3 m.
#
# **One object and one rotation per run.** `CameraSM.reset()` clears
# `processed_obs` every episode and `post_epoch` overwrites `<output_dir>/0`, so a
# saved `model.pt` holds only the last episode of the last epoch. Objects cycle
# within an epoch and rotations advance per epoch, so a run over both objects saves
# only the second and `n_eval_epochs: 3` keeps only the third rotation. Hence the
# single rotation below and the two invocations. `[0, 0, 0]` puts the handle in
# profile - it runs +X with front +Y, so a 90 degree turn about Y would swing it
# along the view axis and leave nothing to find.
#
# Run it twice, mug and glass, then read the result with
# depth/monty/compare_excursions.py. It fails loudly in the two ways stage 1 can
# fail: excursions still one step (the policy did not take), or excursions that
# never cross the region where the two objects differ (raise `fixed_amount` or
# start off-centre - do not proceed to stage 2). See depth/monty/README.md,
# "Stages".
#
#   python run.py --config-dir <this repo>/depth/monty/conf \
#     experiment=rig_eval_sim_leave_object \
#     experiment.config.environment.env_init_args.data_path=$MONTY_DATA/rig_objects \
#     'experiment.config.eval_env_interface_args.object_names=[rig_mug]' \
#     experiment.config.logging.run_name=scan_rig_mug \
#     experiment.config.model_name_or_path=<model>/pretrained/ \
#     experiment.config.logging.output_dir=<results>

defaults:
  - /monty: graph_exp1000_emin_t3
  - /monty/motor_system_config: naive_scan_5
  - /monty/learning_module: evidence_1lm_nn10_dod003_dts02_gsg0
  - /monty/sensor_module: camera_dist
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_numentalab_dist_agent_semantics0
  - /env_interface: eval_distinctobj_predefined
  - /env_interface/positioning_procedures_eval: getgoodview_fixed_pose
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: basic_info_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    environment:
      env_init_args:
        agents:
          agent_args:
            position: [0.0, 1.5, 0.15]
    monty_config:
      sensor_modules:
        sensor_module_0:
          save_raw_obs: false
          # Stage 3 ran four combinations of these two, one per pair of runs, and
          # each is a different question. Both false is the identity check
          # (`substoff_`): the new parameters must reproduce `base048_` exactly.
          # Substitution on, probe off (`subston_`) isolates the depth move - read
          # it with `compare_excursions.py --depths`. Both on (`offobj_`) is the
          # measurement, read with `--in-model`. The file is left in that last
          # state because it is the one the recorded result came from.
          substitute_off_object_depth: true
        sensor_module_1:
          save_raw_obs: false
      learning_modules:
        learning_module_0:
          process_off_object: true
          hypotheses_updater_args:
            # The penalty, in the units evidence uses elsewhere ([-1, 2],
            # hypotheses_displacer.py:40). 0.0 exercises the whole null path and
            # scores nothing, which is what inert4_rig_* proves: opening the gate
            # changes no result. The stage 4 sweep ran 0.01 and 1.0, two orders
            # apart, and both reach the correct verdict, so the disconfirmation is
            # a property of the geometry rather than a tuned constant.
            #
            # **0.01 is settled - do not retune it for the generalisation test**,
            # which would forfeit the point of the sweep. 1.0 reorders hypotheses
            # mid-episode (the glass capture's eventual winner is behind for its
            # first 57 steps) and stage 5's rebase does not change that; it only
            # stops 1.0 destroying a third object's hypothesis space.
            off_object_contradiction: 1.0
            # Whether a null observation is tested as a ray rather than a point.
            # False reproduces every result through stage 5.
            off_object_ray_carve: false
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 4000
    max_total_steps: 6000
    n_train_epochs: 3
    n_eval_epochs: 1
    model_name_or_path: ''
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      # One LM, so a count of two is never satisfied and the episode ends only when
      # the NaiveScan recognition policy reaches 307 steps. The spiral has to run to
      # the end for both objects, or the step-by-step comparison has nothing to
      # align - stage 1 measures where the sensor went, not what Monty concluded.
      count: 2
    recognition_policy:
      # Ends the episode itself at k*(k-1)+1 = 307 steps for k = ceil(90/5), which is
      # the spiral's own length. Upstream now computes what we used to cap by hand.
      _target_: tbp.monty.experiment.recognition_policy.NaiveScan
      fixed_amount: 5
      max_total_steps: 6000
    seed: 42
    supervised_lm_ids: []
    eval_env_interface_args:
      object_names:
        # File is run twice, once for mug and once for glass
        - rig_glass
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations:
          - [0, 0, 0]
    logging:
      run_name: rig_eval_sim_leave_object
