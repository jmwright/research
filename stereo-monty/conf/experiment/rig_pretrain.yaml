# @package _global_

# Pretrains Monty on the CAD the rig's test objects were printed from, so that a
# capture has something to be recognised *against*. Recognition needs alternatives:
# scoring a rig capture against a library that does not contain the object is a
# confusion guaranteed by construction, not a result.
#
# This is only-surf-agent training, unchanged from
# only_surf_agent_training_numenta_lab_obj beyond the run name - Numenta's own loop
# is scan, pretrain in Habitat on the mesh, then infer on a real RGBD frame, and the
# rig's advantage is that the "scan" is the CAD itself.
#
# The library and the objects in it are passed on the command line rather than fixed
# here, because which objects make a fair comparison is the experiment:
#
#   python run.py --config-dir <this repo>/depth/monty/conf \
#     experiment=rig_pretrain \
#     experiment.config.environment.env_init_args.data_path=<object library> \
#     +experiment.config.train_env_interface_args.object_names=[rig_mug,rig_block] \
#     experiment.config.logging.output_dir=$MONTY_MODELS/my_trained_models
#
# Build the object library with ../make_object_library.py. Two objects at
# 14 rotations takes well over ten minutes; run it in the background.

defaults:
  - /monty: graph_exp1000_e3_t3
  - /monty/motor_system_config: surface_curvature_informed_goal0
  - /monty/learning_module: displacement_delta
  - /monty/sensor_module: camera_surf_rgba
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_numentalab_surf_agent
  - /env_interface: train_numentalabobj_predefined
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: silent_warning_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: ${constants.rotations_all_count}
    n_eval_epochs: 3
    model_name_or_path: ''
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    recognition_policy:
      _target_: tbp.monty.experiment.recognition_policy.MaxTotalSteps
      max_total_steps: 6000
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: rig_objects_surf_agent
