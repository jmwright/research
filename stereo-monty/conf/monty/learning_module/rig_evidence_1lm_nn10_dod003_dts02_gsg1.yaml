# @package experiment.config.monty_config.learning_modules

# `evidence_1lm_nn10_dod003_dts02_gsg0` with a goal generator attached, and nothing
# else changed.
#
# The `gsg0` suffix on the upstream option means *no goal generator exists* - the
# file has no `gsg:` block at all, so nothing generates goals and setting
# `use_goal_driven_actions` anywhere else is inert. That is the second of the two
# silent blockers recorded at the end of stage 5. `evidence_1lm_nn5_dod003` is the
# upstream file that shows the enabled form; every value below is copied from it
# except `desired_object_distance`, which cannot be.
#
# `min_post_goal_success_steps` defaults to `np.inf`, which disables
# hypothesis-testing outright. It is a *necessary* condition - the LM must take
# this many non-goal steps before a new goal is even considered - so it has to be
# finite or the GSG is present and still silent. 5 is upstream's value.
#
# **`desired_object_distance` is the one value that must not be copied.** Upstream
# uses 0.03 for a surface agent whose finger sits on the object. The goal's location
# is the target surface point plus its normal times this distance times 1.5, and
# `JumpToGoal` puts the *agent* exactly there, so 0.03 teleports a distant agent to
# 45 mm off the surface. The spiral's agent sits 150 mm from the object axis - 130
# mm off a 40 mm diameter bar - and the patch spans 11.4 degrees, so the jump would
# change the footprint from 23 mm to 8 mm and the recognised curvature with it. The
# library was learned at neither distance, but only one of the two matches the
# observations every earlier stage was scored on. 130 / 1.5 = 0.0867.
#
# Run the 0.03 variant too - it is a one-line override and it is the honest test of
# whether the standoff matters. See `depth/monty/README.md`, "Stage 6".

defaults:
  - hypotheses_updater/burst_sampling_10nn_dts02@learning_module_0

learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  feature_weights:
    patch:
      hsv: ${np.array:[2, 0.5, 0.5]}
      pose_vectors: ${np.ones:3}
      principal_curvatures_log: ${np.ones:2}
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log: ${np.ones:2}
  max_match_distance: 0.01
  x_percent_threshold: 20
  evidence_threshold_config: all
  max_graph_size: 0.3
  num_model_voxels_per_dim: 100
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    elapsed_steps_factor: 10
    min_post_goal_success_steps: 5
    x_percent_scale_factor: 0.75
    desired_object_distance: 0.0867
